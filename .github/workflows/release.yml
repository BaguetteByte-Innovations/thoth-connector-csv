# Published by pushing a `vX.Y.Z` tag. The monorepo is the source of truth: do not edit this file
# in the public repo.
#
# Builds the connector (Native AOT, win-x64) from this tag, packs its kit (exe + manifest.json +
# config.example.json, flat: it extracts as is into connectors-ext/<id>/ of the Thoth Engine) and
# creates the GitHub release with the zip, its checksums and a provenance attestation.

name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    # Native AOT link for win-x64: needs the Visual Studio C++ tools of the Windows runner.
    runs-on: windows-latest
    permissions:
      contents: write      # create the release
      id-token: write      # OIDC token: provenance attestation
      attestations: write  # provenance attestation
    env:
      PROJECT: Thoth.Connectors.Csv
      CONNECTOR_ID: csv
      ASSET_PREFIX: thoth-connector-csv-windows-x64
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check the tag format
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') {
            Write-Output "::error::Tag '$tag' is not a version tag (expected vX.Y.Z or vX.Y.Z-suffix)."
            exit 1
          }
          $version = $tag.Substring(1)
          "VERSION=$version" >> $env:GITHUB_ENV
          "PRERELEASE=$(if ($version.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_ENV

      # Full history: MinVer derives the version from the tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: |
          dotnet publish "$($env:PROJECT).csproj" -c Release -r win-x64 -o kit -p:AllowedReferenceRelatedFileExtensions=none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem kit -Filter *.pdb -Recurse | Remove-Item -Force

      # The csproj publishes manifest.json and config.example.json: this catches the day it stops.
      - name: Check the kit content
        run: |
          $root = (Resolve-Path kit).Path
          $actual = @(Get-ChildItem kit -Recurse -File | ForEach-Object { $_.FullName.Substring($root.Length + 1) } | Sort-Object)
          $expected = @("$($env:PROJECT).exe", 'manifest.json', 'config.example.json' | Sort-Object)
          if (($actual -join '|') -ne ($expected -join '|')) {
            Write-Output "::error::The kit must hold exactly $($expected -join ', '). It holds: $($actual -join ', ')."
            exit 1
          }

      # MinVer (MinVerTagPrefix=v) stamps the version of the tag into the exe.
      - name: Check the tag matches the connector version
        run: |
          $productVersion = (Get-Item "kit/$($env:PROJECT).exe").VersionInfo.ProductVersion
          if ($productVersion -ne $env:VERSION -and -not $productVersion.StartsWith("$($env:VERSION)+")) {
            Write-Output "::error::Tag $($env:GITHUB_REF_NAME) does not match the connector version $productVersion."
            exit 1
          }

      - name: Zip the kit
        run: |
          $zip = "$($env:ASSET_PREFIX)-$($env:VERSION).zip"
          Compress-Archive -Path kit/* -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Contract version
        run: |
          $contract = (dotnet msbuild "$($env:PROJECT).csproj" -getProperty:ThothAbstractionsVersion).Trim()
          if (-not $contract) { Write-Output "::error::ThothAbstractionsVersion is empty."; exit 1 }
          "CONTRACT=$contract" >> $env:GITHUB_ENV

      # sha256sum format (lowercase hex, two spaces, LF): Set-Content would write CRLF.
      - name: Checksums
        run: |
          $hash = (Get-FileHash $env:ZIP -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'SHA256SUMS.txt'), "$hash  $($env:ZIP)`n")

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.ZIP }}

      - name: Release notes
        run: |
          $notes = @'
          ## __REPO__ __VERSION__

          Built against `Thoth.Integration.Abstractions` __CONTRACT__ (https://www.nuget.org/packages/Thoth.Integration.Abstractions/__CONTRACT__).

          ### Installation

          Extract the archive into `connectors-ext/__ID__/` under the Thoth Engine installation folder (`C:\inetpub\Thoth\connectors-ext\__ID__\` by default), then click **Refresh the connectors** in the Thoth console: no restart is needed. The archive holds no `config.json`, so extracting it over an existing folder keeps the operator's settings. To configure the connector, copy `config.example.json` to `config.json`. See https://thoth-iam.com/docs/en/connectors/#installation.

          ### Verification

          The archive was built from this tag by this repository's release workflow.

          - Checksum: `sha256sum -c SHA256SUMS.txt`, or in PowerShell `Get-FileHash __ZIP__ -Algorithm SHA256` and compare with `SHA256SUMS.txt`.
          - Provenance: `gh attestation verify __ZIP__ --repo __REPOSITORY__`.
          '@
          $notes = $notes.Replace('__REPOSITORY__', $env:GITHUB_REPOSITORY).Replace('__REPO__', $env:GITHUB_REPOSITORY.Split('/')[1]).Replace('__VERSION__', $env:VERSION).Replace('__CONTRACT__', $env:CONTRACT).Replace('__ID__', $env:CONNECTOR_ID).Replace('__ZIP__', $env:ZIP)
          [IO.File]::WriteAllText((Join-Path $PWD 'notes.md'), $notes.Replace("`r`n", "`n"))

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseArgs = @($env:GITHUB_REF_NAME, $env:ZIP, 'SHA256SUMS.txt', '--title', "$($env:GITHUB_REPOSITORY.Split('/')[1]) $($env:VERSION)", '--notes-file', 'notes.md')
          if ($env:PRERELEASE -eq 'true') { $releaseArgs += '--prerelease' }
          gh release create @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
